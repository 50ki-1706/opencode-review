# CI for the opencode-review repository itself (phase-6-03/04/05/06). This is
# not the consumer workflow: it gates the distributable bundle. The repository
# has local developer commits on main but no remote yet, so this workflow starts
# running from the user's first push. Every step is mirrored by the local
# commands in docs/development.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history keeps the dist mismatch check robust after future merges.
          fetch-depth: 0

      - name: Install Vite+
        run: |
          curl -fsSL https://vite.plus | bash
          # The installer splits the layout under the XDG dirs and persists PATH
          # only through shell profiles, which non-interactive CI shells never
          # load. The vp entry under bin/ is a symlink, so hunting the binary
          # with find misses it. Source the generated env file instead.
          vp_config="${XDG_CONFIG_HOME:-$HOME/.config}/vite-plus"
          vp_bin="${XDG_DATA_HOME:-$HOME/.local/share}/vite-plus/bin"
          test -f "$vp_config/env" || { echo "Vite+ env file not found: $vp_config/env"; exit 1; }
          . "$vp_config/env"
          vp --version
          # Later steps run fresh shells and resolve vp through the runner PATH.
          echo "$vp_bin" >> "$GITHUB_PATH"
          # Legacy monolithic installs (VP_HOME pinned) keep binaries in ~/.vite-plus/bin.
          if [ -d "$HOME/.vite-plus/bin" ]; then
            echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Typecheck
        run: vp run typecheck

      - name: Unit / fixture tests
        run: vp run test

      - name: Jev contract tests
        run: vp env exec node --test test/jev/

      - name: Build dist
        run: vp run build

      - name: Checked-in dist matches a fresh build
        run: git diff --exit-code -- dist/

      - name: Rebuild determinism + dist/source match
        run: vp run build:verify

      - name: Two-skill separation (dist bundle)
        run: vp env exec node test/live/two-skill-check.mjs

      - name: Bundle size budget
        run: vp run bundle:check

      - name: Actionlint (pinned)
        run: |
          actionlint_version=1.7.12
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_checksums.txt"
          grep "actionlint_${actionlint_version}_linux_amd64.tar.gz" "actionlint_${actionlint_version}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${actionlint_version}_linux_amd64.tar.gz"
          ./actionlint -color "$GITHUB_WORKSPACE/.github/workflows/"*.yml "$GITHUB_WORKSPACE/examples/"*.yml

      - name: Dist-only Node 24 smoke
        run: bash test/smoke/dist-only-smoke.sh
